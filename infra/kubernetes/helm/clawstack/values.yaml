# Minimal Helm values for ClawStack

image:
  gateway: clawstack/gateway:latest
  learning: clawstack/learning:latest

replicaCount: 1

gateway:
  service:
    type: LoadBalancer
    port: 8080
  grpcPort: 50051
  env:
    DATABASE_URL: postgresql://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ .Release.Name }}-postgres:5432/clawstack
    REDIS_URL: redis://{{ .Release.Name }}-redis:6379

learning:
  service:
    type: ClusterIP
    port: 8000
  env:
    DATABASE_URL: postgresql://{{ .Values.postgres.auth.username }}:{{ .Values.postgres.auth.password }}@{{ .Release.Name }}-postgres:5432/clawstack

postgres:
  enabled: true
  auth:
    username: clawstack
    password: CHANGE_ME
  primary:
    persistence:
      enabled: true
      size: 10Gi

redis:
  enabled: true
  architecture: standalone

resources:
  gateway:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  learning:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
