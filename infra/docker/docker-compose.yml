version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: clawstack
      POSTGRES_USER: clawstack
      POSTGRES_PASSWORD: clawstack_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawstack"]
      interval: 5s
      timeout: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  clawstack-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/gateway.Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"  # gRPC
    environment:
      DATABASE_URL: postgresql://clawstack:clawstack_dev@postgres:5432/clawstack
      REDIS_URL: redis://redis:6379
      PYTHON_LEARNING_URL: http://clawstack-learning:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  clawstack-learning:
    build:
      context: ../..
      dockerfile: infra/docker/learning.Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://clawstack:clawstack_dev@postgres:5432/clawstack
      RUST_GATEWAY_URL: http://clawstack-gateway:8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
